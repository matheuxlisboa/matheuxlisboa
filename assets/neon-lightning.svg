<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Matheus Lisboa</title>
  <desc id="desc">Banner futurista azul com raios animados</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0" stop-color="#020617"/>
      <stop offset=".48" stop-color="#071a3d"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#00d9ff" stop-opacity=".34"/>
      <stop offset="1" stop-color="#005eff" stop-opacity="0"/>
    </radialGradient>
    <filter id="electricGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#00bfff" stroke-opacity=".07"/>
    </pattern>
  </defs>

  <rect width="1200" height="330" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="22" fill="url(#grid)"/>
  <circle cx="600" cy="160" r="360" fill="url(#glow)">
    <animate attributeName="r" values="300;390;300" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".65;1;.65" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#electricGlow)">
    <path d="M0 68 L90 88 L120 58 L165 115 L225 92 L272 138 L330 116" stroke="#0088ff" stroke-width="3" opacity=".8">
      <animate attributeName="opacity" values=".15;1;.25;.8" dur="2.8s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 54 L1118 82 L1080 56 L1038 120 L975 92 L930 140 L866 111" stroke="#00d9ff" stroke-width="3" opacity=".8">
      <animate attributeName="opacity" values=".8;.2;1;.15;.8" dur="3.1s" repeatCount="indefinite"/>
    </path>
    <path d="M75 248 L158 223 L195 255 L242 194 L302 227 L353 183" stroke="#00d9ff" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="0 500;500 0;0 500" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1125 250 L1048 221 L1005 257 L958 196 L895 226 L847 183" stroke="#0077ff" stroke-width="2.5">
      <animate attributeName="stroke-dasharray" values="500 0;0 500;500 0" dur="4.3s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="600" y="145" text-anchor="middle" fill="#ffffff"
        font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800"
        letter-spacing="5">MATHEUS LISBOA</text>

  <text x="600" y="194" text-anchor="middle" fill="#00cfff"
        font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700"
        letter-spacing="3">AI • SOFTWARE • AUTOMATION</text>

  <rect x="356" y="224" width="488" height="1.5" fill="#00bfff" opacity=".8">
    <animate attributeName="width" values="120;488;120" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x" values="540;356;540" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="270" text-anchor="middle" fill="#b9d9ff"
        font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="2">
    INTELIGÊNCIA ARTIFICIAL • MACHINE LEARNING • DEEP LEARNING
  </text>
</svg>
